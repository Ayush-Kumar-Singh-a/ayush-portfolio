<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ayush Kumar Singh | Resume</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b1220;
      --card: rgba(255, 255, 255, 0.06);
      --card2: rgba(255, 255, 255, 0.10);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,0.65);
      --border: rgba(255,255,255,0.12);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --radius: 18px;
      --accent: #6ee7ff;
      --accent2: #9b8cff;
    }

    *{margin:0; padding:0; box-sizing:border-box;}
    body{
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1000px 500px at 20% 0%, rgba(110,231,255,0.16), transparent 60%),
                  radial-gradient(800px 400px at 100% 30%, rgba(155,140,255,0.18), transparent 60%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 18px;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      display:flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar{
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--card2), var(--card));
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .left{
      display:flex;
      flex-direction: column;
      gap: 2px;
    }

    .title{
      font-size: 16px;
      font-weight: 700;
    }

    .sub{
      font-size: 12px;
      color: var(--muted);
    }

    .btns{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn{
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      transition: 0.25s ease;
      text-decoration:none;
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .btn:hover{
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn.primary{
      border: none;
      color: #08101f;
      background: linear-gradient(90deg, rgba(110,231,255,0.9), rgba(155,140,255,0.9));
    }

    .viewer{
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      height: calc(100vh - 130px);
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }

    .note{
      font-size: 12px;
      color: var(--muted);
      text-align:center;
    }

    @media(max-width: 700px){
      body{ padding: 12px; }
      .viewer{ height: calc(100vh - 160px); }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="topbar">
      <div class="left">
        <div class="title">📄 Ayush Kumar Singh — Resume</div>
        <div class="sub">You can view it here or download the PDF</div>
      </div>

      <div class="btns">
        <a class="btn" href="index.html">← Back</a>
        <a class="btn primary" href="assets/resume.pdf" target="_blank">Open PDF</a>
        <a class="btn" href="assets/resume.pdf" download>Download</a>
      </div>
    </div>

    <div class="viewer">
      <iframe src="assets/resume.pdf"></iframe>
    </div>

    <div class="note">
      Tip: If PDF doesn't load, open it using the “Open PDF” button above.
    </div>

  </div>

</body>
</html>
